# The system's weekly delivery scorecard, as a GitHub Action (decision 0062): no Azure resource. Every Monday (and
# on demand) it installs the cmis CLI (a pinned release of Clear Measure Intelligence Scorecard, checksum verified),
# harvests the system's repositories (the system repository and every deployable of system.json, or the list in
# .github/scorecard/connections.json) as GitHubDelivery connections, scores them by ISO week, and commits the numbers
# (JSON, CSV and a markdown summary, by ISO week) to the branch scorecard-data of this repository with the run's own
# token. The dashboards read latest/summary.json of that branch. The delivered stage is Merged.
# Secrets: SCORECARD_SOURCE_TOKEN downloads the cmis release, else the stored token OCTOPUS_GITHUB_TOKEN. The harvest
# reads the system's repositories with SCORECARD_HARVEST_TOKEN, else OCTOPUS_GITHUB_TOKEN, else the run's own token.
name: Weekly scorecard

on:
  schedule:
    - cron: '17 6 * * 1'   # Mondays 06:17 UTC
  workflow_dispatch:
    inputs:
      since_days:
        description: Days of history to harvest
        default: '84'

permissions:
  contents: write

concurrency:
  group: weekly-scorecard
  cancel-in-progress: false

env:
  CMIS_REPO: ClearMeasure/Clear-Measure-Intelligence-Scorecard
  CMIS_TAG: v1.0.3713-delivery.3
  CMIS_SHA256: bea6bc4b011bbc3e0c4307821b832671bb3befbf30c8f6da0643dddfa29f9960
  DATA_BRANCH: scorecard-data

jobs:
  scorecard:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Check out this repository
        uses: actions/checkout@v4
        with:
          path: system
      - name: Install cmis (pinned release)
        env:
          GH_TOKEN: ${{ secrets.SCORECARD_SOURCE_TOKEN || secrets.OCTOPUS_GITHUB_TOKEN }}
        run: |
          v="${CMIS_TAG#v}"; f="cmis-$v-linux-x64.tar.gz"
          gh release download "$CMIS_TAG" -R "$CMIS_REPO" -p "$f" -D "$RUNNER_TEMP"
          echo "$CMIS_SHA256  $RUNNER_TEMP/$f" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/cmis" && tar xzf "$RUNNER_TEMP/$f" -C "$RUNNER_TEMP/cmis"
          "$RUNNER_TEMP/cmis/cmis" --version
      - name: Check out the data branch
        working-directory: system
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          if git ls-remote --exit-code --heads origin "$DATA_BRANCH" >/dev/null; then
            git fetch --depth 1 origin "$DATA_BRANCH"
            git worktree add "$RUNNER_TEMP/data" "origin/$DATA_BRANCH"
            git -C "$RUNNER_TEMP/data" switch -c "$DATA_BRANCH"
          else
            git worktree add --orphan -b "$DATA_BRANCH" "$RUNNER_TEMP/data"
            {
              echo '# Weekly delivery scorecard'
              echo
              echo 'Written by .github/workflows/scorecard.yml of the default branch. latest/summary.md is the newest week;'
              echo 'weekly/<ISO week>/ keeps every run; history.csv has one row per run week and scorecard week.'
            } > "$RUNNER_TEMP/data/README.md"
          fi
      - name: Harvest and score
        env:
          CMIS: ${{ runner.temp }}/cmis/cmis
          OUT_DIR: ${{ runner.temp }}/data
          CONNECTIONS_FILE: system/.github/scorecard/connections.json
          HARVEST_TOKEN: ${{ secrets.SCORECARD_HARVEST_TOKEN || secrets.OCTOPUS_GITHUB_TOKEN || github.token }}
          SINCE_DAYS: ${{ inputs.since_days || '84' }}
          SYSTEM_JSON: system/system.json
          SYSTEM_NAME: ${{ github.event.repository.name }}
        run: bash system/scripts/run-weekly-scorecard.sh
      - name: Commit the week's numbers
        working-directory: ${{ runner.temp }}/data
        run: |
          git add -A
          if git diff --cached --quiet; then echo "No change"; exit 0; fi
          git commit -q -m "Scorecard $(date -u +%G-W%V)"
          git push origin "$DATA_BRANCH"
          cat latest/summary.md >> "$GITHUB_STEP_SUMMARY"
